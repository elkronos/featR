# Derived from https://github.com/r-lib/actions/tree/v2/examples
#
# Reports per-file test coverage in the Actions log. Several defects in this
# package existed only because no test combined two particular arguments, so
# the point is to make the untested paths visible rather than assumed.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # A Suggests package that will not install on the runner should not fail
      # the coverage run; every featR function guards its own dependencies.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Report coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          # Write the artifact first, so a failure while formatting the
          # human-readable summary below cannot cost us the report.
          covr::to_cobertura(cov, filename = "cobertura.xml")

          # print.coverage lists overall and per-file percentages.
          print(cov)
          cat(sprintf("\nOverall coverage: %.2f%%\n", covr::percent_coverage(cov)))

          # Lines never executed, which is the actionable part: these are the
          # paths that generated defects in this package before.
          # NOTE: use tally_coverage() rather than zero_coverage(). The latter
          # tries to populate the RStudio marker pane and so loads rstudioapi,
          # which does not exist on a CI runner.
          tally <- covr::tally_coverage(cov)
          zero <- tally[tally$value == 0, c("filename", "line"), drop = FALSE]
          if (nrow(zero) == 0L) {
            cat("\nNo uncovered lines.\n")
          } else {
            cat(sprintf("\n---- %d uncovered line(s) ----\n", nrow(zero)))
            by_file <- table(zero$filename)
            cat("\nUncovered lines per file:\n")
            print(sort(by_file, decreasing = TRUE))
            cat("\nFirst 100 uncovered lines:\n")
            print(utils::head(zero, 100L), row.names = FALSE)
          }
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: cobertura.xml

      - name: Show testthat output
        if: always()
        run: find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
