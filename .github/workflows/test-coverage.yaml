# Derived from https://github.com/r-lib/actions/tree/v2/examples
#
# Reports per-file test coverage in the Actions log. Several defects in this
# package existed only because no test combined two particular arguments, so
# the point is to make the untested paths visible rather than assumed.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # A Suggests package that will not install on the runner should not fail
      # the coverage run; every featR function guards its own dependencies.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Report coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          cat("\n---- Coverage by file ----\n")
          print(covr::coverage_to_list(cov)$filecoverage)
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: cobertura.xml

      - name: Show testthat output
        if: always()
        run: find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
