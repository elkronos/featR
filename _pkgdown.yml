url: https://elkronos.github.io/featR/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "featR: A Unified Toolkit for Feature Selection"
  description: >
    Filter, wrapper, embedded, and dimensionality-reduction methods for
    choosing predictors in R, behind one calling convention and one return
    type.

navbar:
  structure:
    left: [intro, reference, methods, results, news]
    right: [search, github]
  components:
    # Every menu entry is a clickable page; there are no non-clickable
    # section headings in the navbar.
    methods:
      text: Methods
      menu:
        - text: Choosing a method
          href: articles/choosing-a-method.html
        - text: Filter methods
          href: articles/filters.html
        - text: Regularization and embedded importance
          href: articles/regularization.html
        - text: Wrapper methods
          href: articles/wrappers.html
        - text: Dimensionality reduction
          href: articles/dimensionality-reduction.html
    results:
      text: Using results
      menu:
        - text: The fs_result object
          href: articles/fs-result.html
        - text: Validation and leakage
          href: articles/validation-and-leakage.html
        - text: Reproducibility and parallelism
          href: articles/reproducibility.html
        - text: All articles
          href: articles/index.html

articles:
  - title: Start here
    navbar: ~
    contents:
      - featR
      - articles/choosing-a-method
  - title: Methods
    navbar: ~
    contents:
      - articles/filters
      - articles/regularization
      - articles/wrappers
      - articles/dimensionality-reduction
  - title: Using results
    navbar: ~
    contents:
      - articles/fs-result
      - articles/validation-and-leakage
      - articles/reproducibility

# The "Doing it honestly" page was merged into "Validation and leakage".
redirects:
  - ["articles/doing-it-honestly.html", "articles/validation-and-leakage.html"]

reference:
  - title: Working with results
    desc: >
      Every selection function except `fs_pca()` and `fs_svd()` returns an
      `fs_result`. These functions print it, summarize it, and extract the
      selected names.
    contents:
      - selected
      - print.fs_result
      - summary.fs_result
  - title: Filters
    desc: >
      Score each feature without fitting a predictive model. They are fast
      and work on wide data, but they judge one feature at a time, so they
      miss features that only help in combination.
    contents:
      - fs_supervised
      - fs_unsupervised
      - fs_chi
      - fs_infogain
      - fs_correlation
  - title: Regularization and embedded importance
    desc: >
      Fit one model and keep the features it uses: nonzero coefficients for
      the lasso and elastic net, variable importance for random forests, and
      the terms of the final MARS model.
    contents:
      - fs_lasso
      - fs_elastic
      - fs_randomforest
      - fs_mars
  - title: Wrappers
    desc: >
      Refit a model on many candidate subsets and keep the best one. They are
      the slowest family, and their choice is tied to the model they refit.
    contents:
      - fs_recursivefeature
      - fs_svm
      - fs_boruta
      - fs_stepwise
      - fs_bayes
  - title: Dimensionality reduction
    desc: >
      Replace the original columns with new components instead of keeping a
      subset. These return a list of their own rather than an `fs_result`.
    contents:
      - fs_pca
      - fs_svd
  - title: Package
    contents:
      - featR-package
